[project]
name = "polymarketv2"
version = "0.1.0"
description = "Hawkes-Merton pricing and market-making engine for Polymarket crypto Up/Down markets (paper trading + backtesting)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "numpy>=2.0.0",
    "scipy>=1.13.0",
    "polars>=0.20.0",
    "pyarrow>=15.0.0",
    "aiohttp>=3.9.0",
    "websockets>=12.0",
    "rich>=15.0.0",
    "python-dotenv>=1.0.1",
]
